name: Submit a GIF
description: Suggest an LGTM GIF for the pull request approval gallery
title: "[GIF] "
labels:
  - gif-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Every GIF is reviewed by a maintainer
        before it appears on the site.

        **Please use a direct GIF URL** from Giphy (`media.giphy.com`) or
        Tenor (`c.tenor.com`), not a webpage link.

  - type: input
    id: gif_title
    attributes:
      label: GIF title
      description: Give your GIF a short, descriptive name.
      placeholder: Kermit Ship It
    validations:
      required: true

  - type: input
    id: gif_url
    attributes:
      label: GIF URL
      description: "Direct image URL. Must start with https:// — use media.giphy.com or c.tenor.com links."
      placeholder: https://media.giphy.com/media/.../giphy.gif
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Reactions
        - Funny
        - Work
        - Love
        - Celebrations
        - Animals
        - Movies
        - Other
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Comma-separated keywords: lgtm, approved, thumbs-up, ship-it, etc."
      placeholder: lgtm, approved, thumbs-up, ship-it
    validations:
      required: true

  - type: checkboxes
    id: rights
    attributes:
      label: Permissions
      options:
        - label: I confirm this GIF is publicly available and I am providing a link (not hosting the file).
          required: true